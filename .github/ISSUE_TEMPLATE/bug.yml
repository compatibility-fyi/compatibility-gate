name: Bug report
description: Report incorrect gate behavior or an action failure.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include GitHub tokens, private repository content, or other secrets.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the published status and relevant log messages.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Minimal configuration
      render: yaml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Action version or commit SHA
    validations:
      required: true
