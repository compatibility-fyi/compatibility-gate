name: Container

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: npm run validate

      - name: Verify committed bundles
        run: git diff --exit-code -- dist

  publish:
    name: publish
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/compatibility-fyi/compatibility-gate
          flavor: latest=false
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=semver,pattern=v{{major}}
            type=raw,value=latest,enable=${{ !github.event.release.prerelease }}

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Verify anonymous manifest access
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          for attempt in {1..10}; do
            if registry_token=$(curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
              "https://ghcr.io/token?scope=repository%3Acompatibility-fyi%2Fcompatibility-gate%3Apull&service=ghcr.io" \
              | jq --exit-status --raw-output '.token | select(type == "string" and length > 0)') \
              && curl --fail --silent --show-error --connect-timeout 5 --max-time 20 \
                --header "Authorization: Bearer $registry_token" \
                --header "Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json" \
                --output /dev/null \
                "https://ghcr.io/v2/compatibility-fyi/compatibility-gate/manifests/$IMAGE_DIGEST"; then
              exit 0
            fi
            sleep 3
          done
          echo "The published compatibility-gate manifest is not anonymously accessible" >&2
          exit 1
